name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntaxe JavaScript
        run: |
          for f in *.js *.mjs ui/*.js vues/*.js outils/*.mjs; do
            node --check "$f"
          done
      - name: Suites JavaScript
        run: node --test test_*.mjs
      - name: Syntaxe Python
        run: |
          python3 -m py_compile serveur.py
          python3 -m py_compile outils/decouper-dvf.py
      - name: Empreinte du cache du service worker
        run: node outils/empreinte-shell.mjs --verifier
      - name: Tests de routage
        run: python3 test_routage.py

  fumee:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Démarrer le serveur local
        run: |
          python3 serveur.py 8090 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8090/ > /dev/null && exit 0
            sleep 1
          done
          echo "Le serveur ne répond pas après 30 s" >&2
          exit 1
      - name: Test de fumée navigateur
        run: node e2e_fumee.mjs
        env:
          BASE_URL: http://localhost:8090
